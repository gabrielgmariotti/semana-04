<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Mini-CRM</title>
    </head>
    <body>
        <h1>Mini-CRM</h1>

        <button onclick="carregar()">Todos os clientes</button>
        <button onclick="sumidos()">Quem sumiu?</button>
        <h2>Cadastrar clientes</h2>
        <input type="text" id="nome" placeholder="Nome">
        <input type="text" id="telefone" placeholder="Telefone">
        <input type="date" id="ultima_compra">
        <button onclick="cadastrar()">Cadastrar</button>

        <p id="lista" style="white-space: pre-line"></p>
        <script>
            async function carregar() {
                const resposta = await fetch("/clientes");
                const clientes = await resposta.json();

                let texto = "";
                for (const c of clientes) {
                    texto = texto + "• " + c.nome + " - " + c.telefone + " - ultima compra: " + c.ultima_compra + "\n";
                }
                document.getElementById("lista").textContent = texto;
            } 
                async function sumidos(){
                    const resposta = await fetch("/sumidos");
                    const clientes = await resposta.json();

                    const lista = document.getElementById("lista");
                    lista.textContent = "";
                    for (const c of clientes) { const numero = "55" + c.telefone.replace(/\D/g, "");
        const texto = "Oi " + c.nome + "! Aqui é da Loja Teste. Faz um tempo que você não aparece — separei umas novidades que têm a ver com você. Posso te mostrar?";

        const link = document.createElement("a");
        link.href = "https://wa.me/" + numero + "?text=" + encodeURIComponent(texto);
        link.target = "_blank";
        link.textContent = "Chamar " + c.nome + " no WhatsApp — sumido desde " + c.ultima_compra;

        lista.appendChild(link);
        lista.appendChild(document.createElement("br"));
    }
                } 
                async function cadastrar() {
                    const nome = document.getElementById("nome").value;
                    const telefone = document.getElementById("telefone").value;
                    const ultima_compra = document.getElementById("ultima_compra").value;

                    await fetch("/clientes", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ nome, telefone, ultima_compra })
                    });
                    
                    carregar();
                }
    </script>
</body>
</html>
